name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    name: Ritual local testbed E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe base tools
        run: |
          echo "HOME=$HOME"; whoami
          which curl bash git || true
          curl --version | head -1

      - name: Install Foundry (direct release tarball)
        run: |
          set -euo pipefail
          FDIR="$HOME/foundry"
          FURL="https://github.com/foundry-rs/foundry/releases/download/v1.8.4/foundry_v1.8.4_linux_amd64.tar.gz"
          mkdir -p "$FDIR"
          curl -LsSf "$FURL" -o /tmp/foundry.tar.gz
          tar -xzf /tmp/foundry.tar.gz -C "$FDIR"
          chmod +x "$FDIR"/* || true
          ls -1 "$FDIR"
          echo "Foundry installed to $FDIR"

      - name: Add foundry to PATH
        run: echo "$HOME/foundry" >> "$GITHUB_PATH"

      - name: Verify foundry
        run: |
          forge --version
          anvil --version
          cast --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build contracts
        run: forge build

      - name: Run E2E suites + replay regression on local anvil (chain 1979)
        env:
          # CI has no real LLM/DA — the E2E uses the mock precompiles and these
          # dummy values are only consumed by the official request builder.
          OPENROUTER_API_KEY: "sk-or-ci-dummy"
          HF_TOKEN: "hf-ci-dummy"
          HF_REPO_ID: e2e/mock
        run: |
          set -euo pipefail
          export RPC=http://127.0.0.1:8545
          # Same lifecycle helper make and Docker use: detached start, RPC
          # readiness polled rather than slept, chain at genesis, deployer
          # funded from the key actually in use (not a hardcoded address).
          export PRIVATE_KEY="$(cat .anvil_key)"
          export DEPL="$(cast wallet address --private-key "$PRIVATE_KEY")"
          ./scripts/anvil_ctl.sh fresh
          trap './scripts/anvil_ctl.sh down >/dev/null 2>&1 || true' EXIT
          python3 scripts/deploy_mocks.py --manifest mocks/persistent.json
          python3 scripts/e2e.py
          echo "--- swapping 0x0820 to the trading agent ---"
          python3 scripts/deploy_mocks.py --manifest mocks/trading.json
          python3 scripts/desk_e2e.py
          echo "--- precompile zoo: mocks for precompiles other than 0x0820 ---"
          python3 scripts/deploy_mocks.py --manifest mocks/zoo.json
          python3 scripts/zoo_e2e.py
          # Regression gate: run the CURRENT build and diff it against the
          # committed recordings. One per pipeline, so a change anywhere in the
          # persistent agent, the trading desk, or the precompile zoo fails here.
          for r in desk persistent zoo; do
            echo "--- golden regression: $r ---"
            python3 scripts/replay_run.py --golden "replay/$r-golden.json" --run "$r"
          done
